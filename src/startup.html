<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Starting Verity</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;place-items:center;background:#15191f;color:#e7ebf0;font:14px system-ui,sans-serif;-webkit-app-region:drag}.loading{width:270px;text-align:center}img{width:220px;height:auto}p{color:#aeb7c5;margin:30px 0 18px}.track{height:3px;background:#303741;border-radius:4px;overflow:hidden}.track:after{content:'';display:block;width:40%;height:100%;background:#ecb94a;animation:progress 1.4s ease-in-out infinite}@keyframes progress{from{transform:translateX(-100%)}to{transform:translateX(350%)}}@media(prefers-reduced-motion:reduce){.track:after{animation:none;width:100%;opacity:.7}}
</style></head><body><main class="loading" role="status"><img src="./assets/verity-wordmark.png" alt="Verity"><p>Starting your workspace…</p><div class="track" role="progressbar" aria-label="Starting Verity"></div></main></body></html>

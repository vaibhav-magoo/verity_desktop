<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Verity motion atlas</title>
  <desc id="description">A golden Verity companion surrounded by 15 reference expressions, 721 behavioral animations, and 16 motion categories.</desc>
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientTransform="matrix(900 620 -760 1110 562 20)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22200C"/>
      <stop offset=".56" stop-color="#111214"/>
      <stop offset="1" stop-color="#090A0B"/>
    </radialGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="rotate(47 -50 700) scale(190)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF65B"/>
      <stop offset=".58" stop-color="#F4E500"/>
      <stop offset="1" stop-color="#BCAE00"/>
    </radialGradient>
    <linearGradient id="ring" x1="353" x2="662" y1="201" y2="503" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4E500" stop-opacity=".58"/>
      <stop offset="1" stop-color="#F4E500" stop-opacity=".04"/>
    </linearGradient>
    <filter id="glow" x="286" y="151" width="410" height="410" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#F4E500" fill-opacity=".16"/>
    </pattern>
  </defs>
  <rect width="1200" height="660" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="660" rx="28" fill="url(#grid)" opacity=".48"/>
  <circle cx="490" cy="330" r="156" fill="#F4E500" fill-opacity=".15" filter="url(#glow)"/>

  <text x="977" y="379" fill="#F3F0E3" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="650">16</text>
  <text x="1029" y="378" fill="#8E908B" font-family="Segoe UI,Arial,sans-serif" font-size="12">categories</text>

  <text x="81" y="72" fill="#F4E500" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.1">MOTION ATLAS</text>
  <text x="64" y="128" fill="#F3F0E3" font-family="Georgia,serif" font-size="35">A presence with range.</text>
  <text x="66" y="158" fill="#9E9F99" font-family="Segoe UI,Arial,sans-serif" font-size="14">One expressive companion. Hundreds of ways to react.</text>
